<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection - Happy vs Sad Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        #video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }

        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 1.2em;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .stat-card {
            flex: 1;
            max-width: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-card.happy {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card.sad {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .stat-count {
            font-size: 2.5em;
            font-weight: bold;
        }

        .current-emotion {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .current-emotion-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .current-emotion-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .person-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: #e8f4f8;
            border-radius: 10px;
            font-size: 0.95em;
            color: #555;
        }

        .person-id {
            font-weight: bold;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .status-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            z-index: 10;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38ef7d;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😊 Emotion Detector</h1>
        <p class="subtitle">Track happy and sad expressions - counts only for different people</p>

        <div id="loading" class="loading">Loading face detection models...</div>
        <div id="error" class="error hidden"></div>

        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="placeholder" class="placeholder">
                Click "Start Detection" to begin
            </div>
            <div id="statusIndicator" class="status-indicator hidden">
                <span class="status-dot"></span>
                <span>Detecting...</span>
            </div>
        </div>

        <div class="person-info" id="personInfo">
            Waiting for person...
        </div>

        <div class="current-emotion">
            <div class="current-emotion-label">Current Emotion</div>
            <div class="current-emotion-value" id="currentEmotion">
                <span style="font-size: 1.2em;">😐</span> Neutral
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card happy">
                <div class="stat-emoji">😊</div>
                <div class="stat-label">Happy People</div>
                <div class="stat-count" id="happyCount">0</div>
            </div>
            <div class="stat-card sad">
                <div class="stat-emoji">😢</div>
                <div class="stat-label">Sad People</div>
                <div class="stat-count" id="sadCount">0</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-start">▶ Start Detection</button>
            <button id="stopBtn" class="btn-stop hidden">⏹ Stop Detection</button>
            <button id="resetBtn" class="btn-reset">↻ Reset Count</button>
        </div>
    </div>

    <!-- Load face-api.js library -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <script>
        // Wait for library to load
        window.addEventListener('load', function() {
            initApp();
        });

        function initApp() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const placeholder = document.getElementById('placeholder');
            const statusIndicator = document.getElementById('statusIndicator');
            const currentEmotionEl = document.getElementById('currentEmotion');
            const personInfoEl = document.getElementById('personInfo');
            const happyCountEl = document.getElementById('happyCount');
            const sadCountEl = document.getElementById('sadCount');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resetBtn = document.getElementById('resetBtn');
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            let stream = null;
            let detectionInterval = null;
            let happyCount = 0;
            let sadCount = 0;
            let modelsLoaded = false;

            // Store face descriptors of people who were already counted
            let happyPeopleDescriptors = [];
            let sadPeopleDescriptors = [];
            
            let currentPersonDescriptor = null;
            let currentPersonId = 0;

            // Load face-api.js models
            async function loadModels() {
                try {
                    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
                    
                    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                    
                    modelsLoaded = true;
                    loadingEl.classList.add('hidden');
                    console.log('Models loaded successfully');
                } catch (error) {
                    console.error('Error loading models:', error);
                    showError('Failed to load face detection models. Please refresh the page.');
                    loadingEl.classList.add('hidden');
                }
            }

            function showError(message) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }

            function hideError() {
                errorEl.classList.add('hidden');
            }

            async function startDetection() {
                if (!modelsLoaded) {
                    showError('Models are still loading. Please wait...');
                    return;
                }

                try {
                    hideError();
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'user' } 
                    });
                    
                    video.srcObject = stream;
                    placeholder.classList.add('hidden');
                    statusIndicator.classList.remove('hidden');
                    startBtn.classList.add('hidden');
                    stopBtn.classList.remove('hidden');

                    // Wait for video to be ready
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        detectEmotions();
                    };

                } catch (error) {
                    console.error('Error accessing camera:', error);
                    showError('Camera access denied. Please allow camera permissions and try again.');
                }
            }

            async function detectEmotions() {
                if (!stream) return;

                const displaySize = { width: video.videoWidth, height: video.videoHeight };
                faceapi.matchDimensions(canvas, displaySize);

                detectionInterval = setInterval(async () => {
                    const detections = await faceapi
                        .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks()
                        .withFaceExpressions()
                        .withFaceDescriptors();

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detections && detections.length > 0) {
                        const resizedDetections = faceapi.resizeResults(detections, displaySize);
                        
                        // Draw detections
                        faceapi.draw.drawDetections(canvas, resizedDetections);
                        faceapi.draw.drawFaceExpressions(canvas, resizedDetections);

                        // Get the first face
                        const detection = detections[0];
                        const expressions = detection.expressions;
                        const descriptor = detection.descriptor;

                        const maxEmotion = Object.keys(expressions).reduce((a, b) => 
                            expressions[a] > expressions[b] ? a : b
                        );

                        // Check if this is a new person
                        const isNewPerson = checkIfNewPerson(descriptor);
                        
                        if (isNewPerson) {
                            currentPersonDescriptor = descriptor;
                            currentPersonId++;
                            personInfoEl.innerHTML = `Detected: <span class="person-id">Person #${currentPersonId}</span>`;
                        }

                        // Update emotion display and count
                        updateEmotion(maxEmotion, expressions[maxEmotion], descriptor);
                    } else {
                        personInfoEl.textContent = 'No face detected';
                        currentEmotionEl.innerHTML = '<span style="font-size: 1.2em;">😐</span> Neutral';
                    }
                }, 100);
            }

            function checkIfNewPerson(newDescriptor) {
                if (!currentPersonDescriptor) {
                    return true; // First person
                }

                // Calculate distance between current and new descriptor
                const distance = faceapi.euclideanDistance(currentPersonDescriptor, newDescriptor);
                
                // If distance > 0.6, it's a different person
                return distance > 0.6;
            }

            function wasPersonAlreadyCountedForEmotion(descriptor, emotion) {
                const descriptorList = emotion === 'happy' ? happyPeopleDescriptors : sadPeopleDescriptors;
                
                for (let savedDescriptor of descriptorList) {
                    const distance = faceapi.euclideanDistance(savedDescriptor, descriptor);
                    if (distance < 0.6) {
                        return true; // This person was already counted for this emotion
                    }
                }
                return false;
            }

            let emotionConfidenceThreshold = 0.7;

            function updateEmotion(emotion, confidence, descriptor) {
                // Only update if confidence is high enough
                if (confidence < emotionConfidenceThreshold) {
                    return;
                }

                let displayEmotion = 'neutral';
                let emoji = '😐';

                if (emotion === 'happy' && confidence > emotionConfidenceThreshold) {
                    displayEmotion = 'happy';
                    emoji = '😊';
                    
                    // Only count if this person hasn't been counted for happy yet
                    if (!wasPersonAlreadyCountedForEmotion(descriptor, 'happy')) {
                        happyCount++;
                        happyCountEl.textContent = happyCount;
                        happyPeopleDescriptors.push(descriptor);
                        console.log('New happy person counted!');
                    }
                    
                } else if (emotion === 'sad' && confidence > emotionConfidenceThreshold) {
                    displayEmotion = 'sad';
                    emoji = '😢';
                    
                    // Only count if this person hasn't been counted for sad yet
                    if (!wasPersonAlreadyCountedForEmotion(descriptor, 'sad')) {
                        sadCount++;
                        sadCountEl.textContent = sadCount;
                        sadPeopleDescriptors.push(descriptor);
                        console.log('New sad person counted!');
                    }
                }

                currentEmotionEl.innerHTML = `<span style="font-size: 1.2em;">${emoji}</span> ${displayEmotion.charAt(0).toUpperCase() + displayEmotion.slice(1)}`;
            }

            function stopDetection() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                if (detectionInterval) {
                    clearInterval(detectionInterval);
                    detectionInterval = null;
                }

                video.srcObject = null;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                placeholder.classList.remove('hidden');
                statusIndicator.classList.add('hidden');
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                
                currentPersonDescriptor = null;
                personInfoEl.textContent = 'Waiting for person...';
                currentEmotionEl.innerHTML = '<span style="font-size: 1.2em;">😐</span> Neutral';
            }

            function resetCounts() {
                happyCount = 0;
                sadCount = 0;
                happyCountEl.textContent = '0';
                sadCountEl.textContent = '0';
                happyPeopleDescriptors = [];
                sadPeopleDescriptors = [];
                currentPersonDescriptor = null;
                currentPersonId = 0;
                personInfoEl.textContent = 'Waiting for person...';
                currentEmotionEl.innerHTML = '<span style="font-size: 1.2em;">😐</span> Neutral';
            }

            // Event listeners
            startBtn.addEventListener('click', startDetection);
            stopBtn.addEventListener('click', stopDetection);
            resetBtn.addEventListener('click', resetCounts);

            // Load models on page load
            loadModels();
        }
    </script>
</body>
</html>
